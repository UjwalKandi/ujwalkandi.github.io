baseURL: "https://ujwalkandi.in/"
locale: en-us
title: Ujwal Kandi
paginate: 5
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
googleAnalytics: G-M6PE73SR22

minify:
    disableXML: true

menu:
    main:
        - name: About
          url: /about/
          weight: 5
        - name: Projects
          url: /projects/
          weight: 10
        - name: Links
          url: /links/
          weight: 15
        - name: Archive
          url: /archive/
          weight: 20
          params:
              newTab: true
        - name: Resume
          url: /assets/ujwal-kandi-resume.pdf
          weight: 25
          params:
              newTab: true

outputs:
    home:
        - HTML
        - RSS
        - JSON

params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Personal Website/Blog of Ujwal Kandi"
    author: Ujwal Kandi

    defaultTheme: auto
    # Kept off to match the old per-page sites' minimal look: no share icons,
    # no breadcrumbs, no auto Table of Contents, no date/readtime/author meta.
    ShowShareButtons: false
    ShowReadingTime: false
    displayFullLangName: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowToc: false

    homeInfoParams:
        Title: "Ujwal Kandi"
        # Literal block (|), not folded (>): folding collapses the newlines and
        # runs the lines together into one paragraph.
        Content: |
            Data Operations & Observability Engineer, currently keeping Apple TV's global content pipeline observable. Taking [blurry pictures](/archive/) in my free time.

            Previously @ Epsilon, Dover Fueling Solutions & Sports Excitement.<br>
            M.S. Information Technology & Management @ UT Austin.

    socialIcons:
        - name: link
          title: Links
          url: "https://ujwalkandi.in/links"
        - name: RsS
          url: "index.xml"

    assets:
        favicon: "https://ujwalkandi.in/assets/img/favicon.ico"
        favicon16x16: "https://ujwalkandi.in/assets/img/favicon-16x16.png"
        favicon32x32: "https://ujwalkandi.in/assets/img/favicon-32x32.png"
        apple_touch_icon: "https://ujwalkandi.in/assets/img/apple-touch-icon.png"
        safari_pinned_tab: "https://ujwalkandi.in/assets/img/android-chrome-512x512.png"

markup:
    goldmark:
        renderer:
            unsafe: true

privacy:
    twitter:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    instagram:
        disableInlineCSS: true
    twitter:
        disableInlineCSS: true
